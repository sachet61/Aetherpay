
name: Refresh Graphify Code Graph

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "graphify-out/**"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: graphify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: python -m pip install graphifyy

      - name: Build or update the code graph
        shell: bash
        run: |
          if [ -f graphify-out/graph.json ]; then
            graphify update . --force
          else
            graphify extract . --code-only
          fi

      - name: Commit graph updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f graphify-out/

          if git diff --cached --quiet; then
            echo "No Graphify changes to commit."
            exit 0
          fi

          git commit -m "chore(graphify): refresh code graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
